# Deploys the "api" Edge Function (searches + Claude/Gemini) whenever it changes.
# Needs two repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   SUPABASE_ACCESS_TOKEN  from supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   the <project-ref> part of your Supabase URL
# The function's own API keys (GEMINI_API_KEY, TMDB_API_KEY, ...) are set in Supabase:
# Dashboard → Edge Functions → Secrets.
name: Supabase function

on:
  push:
    branches: [main]
    paths: ["supabase/functions/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
